# ============================================================
#  k-ticketing-notifier — 설정 예시 (v4: 서울야외도서관 추가)
# ============================================================

notifiers:
  ntfy:
    enabled: true
    topic: "${NTFY_TOPIC}"
    server: "${NTFY_SERVER:https://ntfy.sh}"
    tags: ["ticket", "loudspeaker"]
  pushover:
    enabled: false
    user_key: "${PUSHOVER_USER_KEY}"
    app_token: "${PUSHOVER_APP_TOKEN}"
    urgent_sound: "siren"
    normal_sound: "magic"
    retry_seconds: 60
    expire_seconds: 1800
  telegram:
    enabled: false
    bot_token: "${TELEGRAM_BOT_TOKEN}"
    chat_ids: "${TELEGRAM_CHAT_IDS}"

watchers:

  # ============================================================
  #  무주산골영화제 (2026.06 종료 — 모두 비활성)
  #  새 시즌 시작 시 enabled: true 로 재활성
  # ============================================================
  - name: "무주산골 숙박 6/6 가족호텔(골드)"
    type: "mjff_lodging"
    enabled: false                                # ← 비활성
    interval_minutes: 5
    cooldown_minutes: 15
    settings:
      target_url: "https://ticket.dtidea.kr/mjff/html/03/04.php"
      booking_button_text: "예매하기"
      select_date: "6. 6.(토)"
      session_name: "mjff-lodging-0606"
      targets:
        - name: "가족호텔(골드)"
          available_keyword: "예약 가능"
          status_cell_index: 4

  - name: "무주등나무운동장 6/6"
    type: "mjff_stadium"
    enabled: false                                # ← 비활성
    interval_minutes: 5
    cooldown_minutes: 15
    settings:
      target_url: "https://ticket.dtidea.kr/mjff/html/03/01.php"
      booking_button_text: "예매하기"
      session_name: "mjff-stadium"
      targets:
        - date_label: "6. 6.(토)"
          sold_out_keyword: "온라인매진"
          available_keyword: "예매하기"

  - name: "무주산골 실내상영 6/6"
    type: "mjff_screening"
    enabled: false                                # ← 비활성
    interval_minutes: 5
    cooldown_minutes: 15
    settings:
      date: "2026-06-06"
      headless: true
      session_name: "mjff-screening-0606"
      sold_out_keyword: "온라인매진"
      available_keyword: "예매하기"
      targets:
        - movie: "별과 모래"
          time: "10:30"
        - movie: "어떻게 해야 했을까?"
          time: "14:00"
        - movie: "후광"
          time: "13:30"
        - movie: "산양들"
          time: "16:30"
        - movie: "아코디언 도어"
          time: "17:30"

  - name: "운문산 반딧불이 6/6"
    type: "firefly"
    enabled: false                                # ← 비활성 (필요 시 재활성)
    interval_minutes: 10
    cooldown_minutes: 30
    settings:
      target_url: "https://www.firefly.or.kr/content/index.sgk?gubun=f0202&dname=F02"
      headless: true
      session_name: "firefly-naver"
      targets:
        - day_label: "06"
          weekday_hint: "토"
          sold_out_keyword: "예약마감"
          available_keyword: "예약가능"

  # ============================================================
  #  서울야외도서관 힙독클럽 — 신규 (v4 주력)
  #  ✅ 실제 페이지 분석 완료: '모집 정원 현재/총' 숫자 기반 빈자리 감지
  # ============================================================
  - name: "서울야외도서관 힙독클럽 5개 프로그램"
    type: "seoul_outdoor_library"
    enabled: true
    interval_minutes: 5
    cooldown_minutes: 10
    settings:
      target_url: "https://seouloutdoorlibrary.kr/user/program/selectPageListProgram.do?area_id=hipdok&flag=program_list"
      use_playwright: true        # 이 페이지는 JS 렌더링 → Playwright 필요 (requests 로는 빈 본문)
      headless: true
      max_pages: 10               # 페이지네이션(1·2·3·4…) 자동 순회 상한
      # ── 두 가지 상태 신호를 함께 감시 ────────────────────────────
      #  (A) 상태 배지 : 정원 마감 / 신청 예정 / 신청중 / 대기 신청 중 / 신청 마감 / 종료
      #  (B) 모집 정원 숫자 : 현재/총  (예: 200/200=마감, 199/200=취소표 1자리)
      #  한글 라벨(행사 일시/신청 기간/모집 정원) 순서로 파싱 → 사이트 개편(클래스명 변경)에 강함.
      alert_triggers: ["status_open", "spot_freed"]   # 기본=둘 다(가장 안전)
      #   status_open : 상태가 '신청중/대기 신청 중'으로 전이 (의미적으로 정확)
      #   spot_freed  : 현재<총 (취소표/빈자리; 배지가 늦어도 잡음. 종료·신청마감·신청예정은 제외)
      #   ※ 하나만 원하면  ["status_open"]  또는  ["spot_freed"]  로 변경
      open_statuses: ["신청중", "대기 신청 중"]        # '신청 가능'으로 간주할 상태
      targets:
        - name: "노마드리딩 ③ : 커피향 바다독서 in 강릉"
        - name: "[리딩몹] 최애책 재독단 #4. 소장하고 싶은 그 책"
        - name: "[리딩몹] 챕터 퍼즐 리딩 #1. 기록하기로 했습니다."
        - name: "[힙독클럽 X 서울도서관] 작가힙톡_하주원 작가 : 운동하면 좋은 걸 누가 모르냐고요"
        - name: "[힙독클럽 X 서울도서관] 작가힙톡_하지현 작가 : 스트레스는 나를 어떻게 바꾸는가"

advanced:
  state_dir: "./data/state"
  log_level: "INFO"
  cooldown_minutes: 30

heartbeat:
  enabled: false
  hour: 12
  minute: 0
  priority: "low"
  title: "🟢 k-ticketing-notifier 살아있어요"
  message: "오늘 모니터링 정상 가동 중입니다."
