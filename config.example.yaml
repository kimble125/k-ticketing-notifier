# ============================================================
#  ticket-notifier — 설정 예시
# ============================================================

notifiers:
  ntfy:
    enabled: true
    topic: "${NTFY_TOPIC}"
    server: "${NTFY_SERVER:https://ntfy.sh}"
    tags: ["ticket", "loudspeaker"]
  pushover:
    enabled: false
    user_key: "${PUSHOVER_USER_KEY}"
    app_token: "${PUSHOVER_APP_TOKEN}"
    urgent_sound: "siren"
    normal_sound: "magic"
    retry_seconds: 60
    expire_seconds: 1800
  telegram:
    enabled: false
    bot_token: "${TELEGRAM_BOT_TOKEN}"
    chat_ids: "${TELEGRAM_CHAT_IDS}"

watchers:

  # ============================================================
  #  무주산골영화제 dtidea.kr
  # ============================================================

  # 1) 숙박패키지 6/6 가족호텔(골드) — 일정 선택 흐름
  - name: "무주산골 숙박 6/6 가족호텔(골드)"
    type: "mjff_lodging"
    enabled: true
    interval_minutes: 5
    cooldown_minutes: 15
    settings:
      target_url: "https://ticket.dtidea.kr/mjff/html/03/04.php"
      booking_button_text: "예매하기"
      select_date: "6. 6.(토)"
      session_name: "mjff-lodging-0606"
      targets:
        - name: "가족호텔(골드)"
          available_keyword: "예약 가능"
          unavailable_keyword: "예약 불가"
          status_cell_index: 4

  # 2) 등나무운동장 1일 입장권 6/6
  - name: "무주등나무운동장 6/6"
    type: "mjff_stadium"
    enabled: true
    interval_minutes: 5
    cooldown_minutes: 15
    settings:
      target_url: "https://ticket.dtidea.kr/mjff/html/03/01.php"
      booking_button_text: "예매하기"
      session_name: "mjff-stadium"
      targets:
        - date_label: "6. 6.(토)"
          sold_out_keyword: "온라인매진"
          available_keyword: "예매하기"

  # 3) 실내상영 06/06 (5편)
  - name: "무주산골 실내상영 6/6"
    type: "mjff_screening"
    enabled: true
    interval_minutes: 5
    cooldown_minutes: 15
    settings:
      date: "2026-06-06"
      headless: true
      session_name: "mjff-screening-0606"
      sold_out_keyword: "온라인매진"
      available_keyword: "예매하기"
      targets:
        - movie: "별과 모래"
          time: "10:30"
        - movie: "어떻게 해야 했을까?"
          time: "14:00"
        - movie: "후광"
          time: "13:30"
        - movie: "산양들"
          time: "16:30"
        - movie: "아코디언 도어"
          time: "17:30"

  # 4) 실내상영 06/07 (1편)
  - name: "무주산골 실내상영 6/7"
    type: "mjff_screening"
    enabled: true
    interval_minutes: 5
    cooldown_minutes: 15
    settings:
      date: "2026-06-07"
      headless: true
      session_name: "mjff-screening-0607"
      sold_out_keyword: "온라인매진"
      available_keyword: "예매하기"
      targets:
        - movie: "리프라이즈"
          time: "14:00"

  # ============================================================
  #  운문산 반딧불이 (firefly.or.kr) — 네이버 로그인 필요
  # ============================================================
  - name: "운문산 반딧불이 6/6"
    type: "firefly"
    enabled: true
    interval_minutes: 10
    cooldown_minutes: 30
    settings:
      target_url: "https://www.firefly.or.kr/content/index.sgk?gubun=f0202&dname=F02"
      headless: true
      session_name: "firefly-naver"
      targets:
        - day_label: "06"          # 6월 캘린더의 06일
          weekday_hint: "토"
          sold_out_keyword: "예약마감"
          available_keyword: "예약가능"

  # ============================================================
  #  (선택) 무주산골 공지사항 — 인증 불필요
  # ============================================================
  # - name: "무주산골 공지"
  #   type: "webpage"
  #   enabled: false
  #   interval_minutes: 30
  #   settings:
  #     url: "https://mjff.or.kr/kor/artyboard/mboard.asp?strBoardID=KZND_Q154"
  #     selector: "a.brd_tit"
  #     encoding: "euc-kr"
  #     keywords: ["예매", "신청"]

advanced:
  state_dir: "./data/state"
  log_level: "INFO"
  cooldown_minutes: 30

heartbeat:
  enabled: false
  hour: 12
  minute: 0
  priority: "low"
  title: "🟢 ticket-notifier 살아있어요"
  message: "오늘 모니터링 정상 가동 중입니다."
