# ============================================================
#  GitHub Actions — 5분마다 자동 모니터링 + 수동 테스트
# ============================================================

name: ticket-notifier

on:
  schedule:
    # 매 5분마다 실행. cron 은 UTC 기준이지만 5분 간격이라 시간대 무관
    - cron: "*/5 * * * *"

  # 수동 실행 (Actions 탭 → Run workflow 버튼)
  workflow_dispatch:
    inputs:
      force_test_alert:
        description: "테스트 알림만 보내고 끝낼지 (사이트 접속 X). ntfy 채널 검증용."
        type: boolean
        default: false

concurrency:
  group: ticket-notifier
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      # ─── 테스트 알림 모드 ─────────────────────────────────
      # workflow_dispatch 로 force_test_alert=true 체크 시 동작
      - name: Run test-alert
        if: ${{ inputs.force_test_alert == true }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
          CONFIG_PATH: config.example.yaml
        run: |
          python main.py --test-alert

      # ─── 일반 체크 모드 (cron 또는 수동 일반 실행) ──────────
      - name: Run check
        if: ${{ inputs.force_test_alert != true }}
        env:
          MJFF_NAME: ${{ secrets.MJFF_NAME }}
          MJFF_PHONE: ${{ secrets.MJFF_PHONE }}
          MJFF_PASS: ${{ secrets.MJFF_PASS }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
          CONFIG_PATH: config.example.yaml
        run: |
          python main.py --check

      - name: Persist state
        if: ${{ inputs.force_test_alert != true }}
        run: |
          if [[ -n "$(git status --porcelain data/state)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/state
            git commit -m "chore: update state $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
            git push
          fi
