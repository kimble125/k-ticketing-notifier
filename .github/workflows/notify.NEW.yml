# ============================================================
#  GitHub Actions — 5분마다 자동 모니터링 + 수동 테스트
#  (v5: Node 24 호환 + Playwright 캐시 + debug 입력)
# ============================================================

name: ticket-notifier

on:
  schedule:
    # 매 5분마다 실행. cron 은 UTC 기준이지만 5분 간격이라 시간대 무관
    - cron: "*/5 * * * *"

  # 수동 실행 (Actions 탭 → Run workflow 버튼)
  workflow_dispatch:
    inputs:
      force_test_alert:
        description: "테스트 알림만 보내고 끝낼지 (사이트 접속 X). ntfy 채널 검증용."
        type: boolean
        default: false
      debug:
        description: "상세 로그(DEBUG) 출력. 크롤러가 무엇을 찾았는지 진단할 때."
        type: boolean
        default: false

concurrency:
  group: ticket-notifier
  cancel-in-progress: false

permissions:
  contents: write

env:
  # 일부 액션이 Node20 deprecation 경고를 내는 것을 Node24 로 강제 (경고 제거)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      # Playwright 브라우저(chromium)를 캐시 → 매 run 마다 재다운로드 방지
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright chromium
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            python -m playwright install-deps chromium
          else
            python -m playwright install --with-deps chromium
          fi

      # ─── 테스트 알림 모드 ─────────────────────────────────
      # workflow_dispatch 로 force_test_alert=true 체크 시 동작
      - name: Run test-alert
        if: ${{ inputs.force_test_alert == true }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
          CONFIG_PATH: config.example.yaml
        run: |
          python main.py --test-alert

      # ─── 일반 체크 모드 (cron 또는 수동 일반 실행) ──────────
      - name: Run check
        if: ${{ inputs.force_test_alert != true }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
          HEARTBEAT_ENABLED: ${{ secrets.HEARTBEAT_ENABLED }}
          CONFIG_PATH: config.example.yaml
          LOG_LEVEL: ${{ inputs.debug == true && 'DEBUG' || 'INFO' }}
        run: |
          python main.py --check

      - name: Persist state
        if: ${{ inputs.force_test_alert != true }}
        run: |
          if [[ -n "$(git status --porcelain data/state)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/state
            git commit -m "chore: update state $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
            git push || echo "::warning::state push 실패(권한/충돌). 다음 run 에서 재시도."
          fi
